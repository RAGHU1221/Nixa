name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile application and tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out dist
          mkdir -p out dist
          find src/main/java -name '*.java' -print > sources.txt
          javac -encoding UTF-8 -d out @sources.txt
          javac -encoding UTF-8 -d out -cp out tools/TestHarness.java

      - name: Run automated tests
        run: xvfb-run --auto-servernum java -cp out com.nixatoolkit.ui.TestHarness

      - name: Build runnable JAR
        run: jar --create --file dist/NixaToolkit.jar --main-class com.nixatoolkit.App -C out .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixa-toolkit-jar
          path: dist/NixaToolkit.jar

  package-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress --yes
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item out, dist, dist-installer -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path out, dist, dist-installer | Out-Null
          Get-ChildItem src/main/java -Recurse -Filter *.java | ForEach-Object FullName | Set-Content sources.txt
          javac -encoding UTF-8 -d out '@sources.txt'
          jar --create --file dist/NixaToolkit.jar --main-class com.nixatoolkit.App -C out .
          $jpackageArgs = @(
            '--type', 'exe',
            '--name', 'Nixa Toolkit',
            '--input', 'dist',
            '--main-jar', 'NixaToolkit.jar',
            '--main-class', 'com.nixatoolkit.App',
            '--dest', 'dist-installer',
            '--app-version', '1.0.12',
            '--vendor', 'Nixa Toolkit',
            '--win-shortcut',
            '--win-menu'
          )
          if (Test-Path packaging/icon.ico) {
            $jpackageArgs += @('--icon', 'packaging/icon.ico')
          }
          & jpackage @jpackageArgs
          $installer = Get-ChildItem dist-installer -Filter *.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content dist-installer/SHA256SUMS.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nixa-toolkit-windows-exe
          path: dist-installer/*
          if-no-files-found: error